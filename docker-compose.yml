services:
  db:
    image: postgres:16-alpine
    container_name: univ_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: univ
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d univ"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: univ_app
    restart: always
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/univ?schema=public"
      DB_HOST: "db"
      DB_PORT: 5432
      DB_USER: "postgres"
      DB_PASSWORD: "postgres"
      DB_NAME: "univ"
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npx prisma db push && npm start"

volumes:
  postgres_data:
